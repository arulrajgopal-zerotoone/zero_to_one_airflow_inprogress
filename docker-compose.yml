# Airflow VM stack — matches the "Airflow VM - Docker Compose" box in the
# Technical architecture diagram in README.md. LocalExecutor runs workers as
# subprocesses of the scheduler, so there is no separate worker container.
#
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN and POSTGRES_HOST/DB/USER/PASSWORD are
# read from ./.env, upserted on every deploy by
# .github/workflows/deploy-compose.yml (the former from the Key Vault secret,
# the latter from repo secrets); install_docker.sh also writes the former
# once at VM boot so the very first `docker compose up -d` has it too.
# POSTGRES_HOST/DB/USER/PASSWORD are the "data" DB credentials the create_insert/tasks scripts use
# (os.environ lookups), not the Airflow metadata DB above. POSTGRES_HOST here
# appends the Azure PostgreSQL suffix, so the raw secret is just the server
# name (matches TF_VAR_postgres_server_name) and tasks read it as-is.
x-airflow-common: &airflow-common
  image: apache/airflow:3.0.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Task supervisor processes talk to the api-server over HTTP; must be the
    # compose *service* name (`webserver`), not localhost — see
    # airflow-task-failure-resolution.md.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://webserver:8080/execution/
    POSTGRES_HOST: ${POSTGRES_HOST}.postgres.database.azure.com
    POSTGRES_AIRFLOW_DB: ${POSTGRES_AIRFLOW_DB}
    POSTGRES_DATA_DB: ${POSTGRES_DATA_DB}
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  # Whole AIRFLOW_HOME is bind-mounted so dags/, tasks/, logs/ (synced from
  # Blob Storage by install_docker.sh) and the auto-generated
  # simple_auth_manager_passwords.json.generated all land on the VM's disk.
  volumes:
    - .:/opt/airflow
  user: "50000:0"
  restart: unless-stopped

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]
    restart: "no"

  webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
