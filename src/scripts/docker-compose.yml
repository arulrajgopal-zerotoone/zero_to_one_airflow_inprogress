# Airflow VM stack — matches the "Airflow VM - Docker Compose" box in
# Architecture.md. LocalExecutor runs workers as subprocesses of the
# scheduler, so there is no separate worker container.
#
# AIRFLOW__DATABASE__SQL_ALCHEMY_CONN is read from ./.env (written by
# scripts/install_docker.sh from the Key Vault secret at VM boot).
x-airflow-common: &airflow-common
  image: apache/airflow:3.0.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # Whole AIRFLOW_HOME is bind-mounted so dags/, tasks/, logs/ (synced from
  # Blob Storage by install_docker.sh) and the auto-generated
  # simple_auth_manager_passwords.json.generated all land on the VM's disk.
  volumes:
    - .:/opt/airflow
  user: "50000:0"
  restart: unless-stopped

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["-c", "airflow db migrate"]
    restart: "no"

  webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
