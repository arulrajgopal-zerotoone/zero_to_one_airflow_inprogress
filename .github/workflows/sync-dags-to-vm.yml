name: Sync DAGs to VM (Manual)

# Manually triggers the VM's existing airflow-blob-sync.sh immediately,
# instead of waiting for the airflow-blob-sync.timer's normal 3-minute
# cadence (installed by IAC/terraform/install_docker.sh). Reaches the VM
# via az vm run-command invoke (same as deploy-compose.yml), since the NSG
# only allows SSH/8080 from the developer's own IP.
on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource group containing the VM
        required: false
        default: rg-airflow-dev
      vm_name:
        description: VM name
        required: false
        default: vm-airflow-dev

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run airflow-blob-sync.sh on the VM
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group || 'rg-airflow-dev' }}
          VM_NAME: ${{ inputs.vm_name || 'vm-airflow-dev' }}
        run: |
          set -euo pipefail

          az vm run-command invoke \
            -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "sudo /usr/local/bin/airflow-blob-sync.sh" \
            --query "value[0].message" -o tsv

      - name: Azure logout
        if: always()
        run: az logout || true
