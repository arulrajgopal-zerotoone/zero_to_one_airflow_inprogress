name: Deploy DAGs

# Pushes src/dags/, src/tasks/ and src/create_insert/ to the "dags" blob
# container, the same az storage blob upload-batch calls documented in
# README.md and used by docker_scripts/upload_dags.ps1 for a local run. The
# VM's airflow-blob-sync.timer (installed by IAC/terraform/install_docker.sh)
# pulls these down within ~3 minutes.
on:
  push:
    branches: [main]
    paths:
      - "src/dags/**"
      - "src/tasks/**"
      - "src/create_insert/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload dags/, tasks/ and create_insert/ to Blob Storage
        env:
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME || 'kaninipro-kv-airflow-dev' }}
          SECRET_NAME: airflow-storage-connection-string
        run: |
          set -euo pipefail
          CONN=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name "$SECRET_NAME" \
            --query value -o tsv)

          az storage blob upload-batch --connection-string "$CONN" \
            -d dags -s src/dags --destination-path dags --overwrite

          az storage blob upload-batch --connection-string "$CONN" \
            -d dags -s src/tasks --destination-path tasks --overwrite

          az storage blob upload-batch --connection-string "$CONN" \
            -d dags -s src/create_insert --destination-path create_insert --overwrite

      - name: Azure logout
        if: always()
        run: az logout || true
