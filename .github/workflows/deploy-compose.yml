name: Deploy Compose Stack

# Pushes docker-compose.yml to the VM and restarts the stack, so a
# change to the stack definition (e.g. adding a service) doesn't require
# manually SSH-ing in and editing /opt/airflow/docker-compose.yml by hand.
# Uses az vm run-command invoke (same as operate-vm.yml) to reach the VM
# through the Azure Resource Manager control plane, since the NSG only allows
# SSH/8080 from the developer's own IP.
on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
  workflow_dispatch:
    inputs:
      resource_group:
        description: Resource group containing the VM
        required: false
        default: rg-airflow-dev
      vm_name:
        description: VM name
        required: false
        default: vm-airflow-dev

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push docker-compose.yml to VM and restart stack
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group || 'rg-airflow-dev' }}
          VM_NAME: ${{ inputs.vm_name || 'vm-airflow-dev' }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME || 'kaninipro-kv-airflow-dev' }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_AIRFLOW_DB: ${{ secrets.POSTGRES_AIRFLOW_DB }}
          POSTGRES_DATA_DB: ${{ secrets.POSTGRES_DATA_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail

          # Base64-encode so the compose file's YAML anchors/quotes/$ signs
          # can't collide with heredoc/shell parsing on the way over.
          B64=$(base64 -w0 docker-compose.yml)

          # Fetch the metadata-DB connection string ourselves rather than
          # relying on install_docker.sh's one-time write at VM boot — if
          # that cloud-init step ever failed (e.g. the Azure CLI installer
          # breaking, or a managed-identity/Key Vault RBAC propagation
          # delay right after VM creation), AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          # would stay blank in .env forever, since nothing else ever wrote it.
          SQL_ALCHEMY_CONN=$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name airflow-postgres-connection-string \
            --query value -o tsv)

          # Same treatment for the DB creds, so a password containing
          # quotes/$ can't break out of the heredoc below.
          ENV_B64=$(printf 'AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=%s\nPOSTGRES_HOST=%s\nPOSTGRES_AIRFLOW_DB=%s\nPOSTGRES_DATA_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\n' \
            "$SQL_ALCHEMY_CONN" "$POSTGRES_HOST" "$POSTGRES_AIRFLOW_DB" "$POSTGRES_DATA_DB" "$POSTGRES_USER" "$POSTGRES_PASSWORD" | base64 -w0)

          cat > /tmp/deploy_compose.sh <<EOF
          #!/bin/bash
          set -euo pipefail
          echo "$B64" | base64 -d > /opt/airflow/docker-compose.yml

          # Upsert both the metadata-DB conn string and the data-DB creds
          # into .env on every deploy, so a bad/missing value never persists
          # past the next push to main.
          touch /opt/airflow/.env
          echo "$ENV_B64" | base64 -d > /tmp/pg.env
          grep -v -E '^(AIRFLOW__DATABASE__SQL_ALCHEMY_CONN|POSTGRES_HOST|POSTGRES_AIRFLOW_DB|POSTGRES_DATA_DB|POSTGRES_USER|POSTGRES_PASSWORD)=' \
            /opt/airflow/.env > /tmp/airflow.env.new || true
          cat /tmp/pg.env >> /tmp/airflow.env.new
          mv /tmp/airflow.env.new /opt/airflow/.env
          chmod 600 /opt/airflow/.env
          rm -f /tmp/pg.env

          cd /opt/airflow
          docker compose up -d
          EOF

          az vm run-command invoke \
            -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --command-id RunShellScript \
            --scripts "@/tmp/deploy_compose.sh" \
            --query "value[0].message" -o tsv

      - name: Azure logout
        if: always()
        run: az logout || true
